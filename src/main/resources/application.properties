spring.application.name=hotel-pms

# ⚠️ Don't add the credentials in the applicaiton.properties file as this is tracked in git
# Instead create your a new file applicaitons-<profile(eg:local/docker)>.properties under the same /resources folder.
# spring.datasource.url=
# spring.datasource.username=
# spring.datasource.password=

# Add which profile is active as of now
spring.profiles.active=local
#dockerdb

# ── SCHEMA OWNERSHIP ─────────────────────────────────────────────────────────
# ✅ Your decision. schema.sql stays the source of truth; Hibernate only checks.
spring.jpa.hibernate.ddl-auto=validate

# Flyway / Liquibase / dbmate: all three are "version control for your schema" —
# numbered, immutable SQL files applied in order, exactly once, tracked in a
# bookkeeping table. Flyway & Liquibase run INSIDE the Spring app at startup;
# dbmate is a standalone binary run outside it. Full comparison -> doc §28②.
# Not now — but Flyway is a good later addition to this project.


# ── OPEN IN VIEW ─────────────────────────────────────────────────────────────
# ✅ Correct — this is exactly how you set it. (Trailing space removed: harmless for
#    a boolean, but for a password/URL a trailing space is a real bug. -> doc §26)
# You'll know it worked: Boot's startup warning about open-in-view disappears.
# The N+1 problem, the two request-flow diagrams, and what "false" actually means
# are all in doc §28③ — that section was rewritten to answer this properly.
spring.jpa.open-in-view=false


# ── SQL VISIBILITY ───────────────────────────────────────────────────────────
# Your question: "a bound parameter is basically the actual values in the SQL?"
# YES — exactly right. Hibernate builds  insert into ... values (?, ?, ?)  and then
# BINDS the real values into the numbered '?' slots. show-sql prints the statement
# (with '?'), the TRACE line prints the values going into the slots.
# Why '?' instead of pasting values in: SQL injection becomes impossible, and the DB
# can reuse one query plan. Full walkthrough -> how-it-all-works.md §10.1
# (You'd already guessed the prepared-statement mechanism. That guess was correct.)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE

